<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfoParser</title>
<style nonce="{{nonce}}">
:root{--bg:#fafaf8;--fg:#1d1d1b;--mut:#6b6b66;--line:#e2e1dc;--card:#fff;--acc:#2b5fd9;--ok:#1f7a3d;--warn:#a5600a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--mut:#9a9992;--line:#2e2e2b;--card:#1e1e1c;--acc:#7aa2ff;--ok:#6fcf8d;--warn:#e0a458;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:16px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0;letter-spacing:.02em}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,input,textarea,select{font:inherit;color:inherit}
nav button{background:none;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--mut)}
nav button[aria-selected=true]{background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:20px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:160px}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:70px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.btn.sec{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.mut{color:var(--mut)}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.badge.stated{color:var(--ok);border-color:var(--ok)}.badge.inferred{color:var(--warn);border-color:var(--warn)}.badge.external{color:var(--acc);border-color:var(--acc)}
.badge.failed,.badge.needs_clarification{color:var(--bad);border-color:var(--bad)}.badge.processed{color:var(--ok);border-color:var(--ok)}
.warn{color:var(--warn)}.err{color:var(--bad)}
.item{cursor:pointer}.item:hover{border-color:var(--acc)}
.item h3{margin:0 0 4px;font-size:15px}
mark{background:none;color:var(--acc);font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:inherit}
.q{border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
.lbl{min-width:210px;color:var(--mut)}
details summary{cursor:pointer;color:var(--mut)}
#msg{position:fixed;bottom:14px;right:14px;max-width:360px}
</style>
</head>
<body>
<header>
  <h1>InfoParser</h1>
  <nav id="tabs" role="tablist" aria-label="Views"></nav>
  <span class="mut" id="hint">press / to search</span>
</header>
<main id="main" aria-live="polite"></main>
<div id="msg" class="card" hidden role="status"></div>
<script nonce="{{nonce}}">
"use strict";
// Rendering only. All server data goes through textContent / DOM creation; no HTML-string injection anywhere.
const $ = (s) => document.querySelector(s);
const main = $("#main");
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);

}
// The ONLY place children are attached: skips null/false (Element.append would print "null") and never parses HTML.

function clear(parent) { parent.replaceChildren(); }
const isHttp = (u) => typeof u === "string" && /^https?:\/\//i.test(u);
const link = (url, label) => isHttp(url)
  ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, label || url)
  : h("span", { class: "mut" }, label || url || "");

  const out = []; let rest = String(text || "");

    const a = rest.indexOf("["), b = rest.indexOf("]", a + 1);
    if (a < 0 || b < 0) { out.push(rest); break; }

function toast(text, bad) {
  const m = $("#msg"); m.textContent = text; m.className = "card " + (bad ? "err" : ""); m.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { m.hidden = true; }, 4000);
}
async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }

const views = { inbox, search: library, ask, topics, duplicates, digest, status, settings };

  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-selected", String(b.dataset.v === name));

  views[name](arg).catch((e) => put(main, h("p", { class: "err" }, e.message)));

put($("#tabs"), ...Object.keys(labels).map((k) =>
  h("button", { role: "tab", "data-v": k, onclick: () => show(k) }, labels[k])));

async function inbox(filter) {
  filter = filter || "";
  const add = h("div", { class: "card" },
    h("div", { class: "row" },
      h("input", { id: "add", class: "grow", placeholder: "Paste a URL or text to save", "aria-label": "URL or text" }),
      h("input", { id: "ctx", class: "grow", placeholder: "Context (optional)", "aria-label": "Context" }),
      h("button", { class: "btn", onclick: act(async () => {
        const v = $("#add").value.trim(); if (!v) return;
        const isUrl = /^https?:\/\/\S+$/i.test(v);
        await api("POST", "/api/inbox", { [isUrl ? "url" : "text"]: v, context: $("#ctx").value || undefined });
        toast("saved"); show("inbox", filter);
      }) }, "Save")));
  const chips = h("div", { class: "row" }, ["", "pending", "processing", "processed", "failed", "needs_clarification"].map((s) =>
    h("button", { class: "btn sec", "aria-pressed": String(s === filter), onclick: () => show("inbox", s) }, s || "all")));
  const rows = await api("GET", "/api/inbox" + (filter ? "?status=" + encodeURIComponent(filter) : ""));
  put(main, add, chips, ...rows.map(inboxRow), rows.length ? null : h("p", { class: "mut" }, "Nothing here yet."));
}
function inboxRow(r) {
  const c = h("div", { class: "card" },
    h("div", { class: "row" }, badge(r.status), h("span", { class: "grow" }, r.what || "(empty)"), h("span", { class: "mut" }, r.content_type || "")));
  if (r.error) put(c, h("p", { class: "err" }, r.error));
  if (r.status === "failed") put(c, h("button", { class: "btn sec", onclick: act(async () => { await api("POST", `/api/inbox/${r.id}/retry`, {}); toast("requeued"); show("inbox"); }) }, "Retry"));
  if (r.status === "needs_clarification") {
    const t = h("textarea", { "aria-label": "Paste the text or add context", placeholder: "Pasted text replaces the content; submit to re-run" });
    put(c, t, h("button", { class: "btn", onclick: act(async () => { const res = await api("POST", `/api/inbox/${r.id}/clarify`, { text: t.value }); toast(res.note || "requeued"); show("inbox"); }) }, "Submit"));
  }
  if (r.source_id) put(c, h("button", { class: "btn sec", onclick: act(async () => {
    const d = await api("GET", `/api/inbox/${r.id}`); if (d.items.length) detail(d.items[0].id); else toast("no items", true);
  }) }, "Open"));

}

async function library(arg) {
  const state = arg || {};
  const q = h("input", { id: "q", class: "grow", type: "search", placeholder: "Search your library", "aria-label": "Search", value: state.q || "" });
  const kind = h("input", { placeholder: "kind", "aria-label": "Kind filter", value: state.kind || "", size: 10 });
  const topic = h("input", { placeholder: "topic", "aria-label": "Topic filter", value: state.topic || "", size: 12 });
  const prov = h("select", { "aria-label": "Provenance filter" }, ["", "stated", "inferred", "external"].map((p) => h("option", { value: p }, p || "any provenance")));
  prov.value = state.provenance || "";
  const out = h("div", { class: "card" , hidden: true });
  const go = act(async () => {
    const p = new URLSearchParams({ q: q.value, kind: kind.value, topic: topic.value, provenance: prov.value });
    const r = await api("GET", "/api/search?" + p);
    clear(out); put(out, h("div", { class: "row" }, badge("mode: " + r.mode, ""), r.egress.length ? badge("sent to: " + r.egress.join(", "), "failed") : null),
      ...r.warnings.map((w) => h("p", { class: "warn" }, "⚠ " + w)),
      ...r.hits.map(hit), r.hits.length ? null : h("p", { class: "mut" }, "No results."));
    out.hidden = false;
  });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  put(main, h("div", { class: "card row" }, q, kind, topic, prov, h("button", { class: "btn", onclick: go }, "Search")), out);
  if (state.q || state.topic) go();
  q.focus();
}
function hit(x) {
  const open = () => (x.item_id ? detail(x.item_id) : (x.source_url && window.open(x.source_url, "_blank", "noopener,noreferrer")));
  return h("div", { class: "card item", tabindex: "0", role: "button", onclick: open, onkeydown: (e) => { if (e.key === "Enter") open(); } },
    h("h3", {}, x.title || "(untitled)"), h("div", { class: "row" }, badge(x.kind, ""), x.provenance ? badge(x.provenance) : null, x.locator ? h("span", { class: "mut" }, x.locator) : null),
    h("p", {}, snippet(x.snippet)));
}

async function detail(id) {

  clear(main);
  const title = h("input", { class: "grow", value: it.title || "", "aria-label": "Title" });
  const body = h("textarea", { "aria-label": "Body" }); body.value = it.body || "";
  const c = h("div", { class: "card" },
    h("div", { class: "row" }, h("button", { class: "btn sec", onclick: () => show("search") }, "← Back"), badge(it.kind, ""), badge(it.provenance),
      it.user_edited ? badge("edited", "") : null, it.confidence != null ? h("span", { class: "mut" }, "confidence " + it.confidence) : null),
    h("div", { class: "row" }, title), body,
    h("div", { class: "row" },
      h("button", { class: "btn", onclick: act(async () => { await api("PATCH", "/api/items/" + id, { title: title.value, body: body.value }); toast("saved"); detail(id); }) }, "Save edits"),
      h("button", { class: "btn sec", onclick: act(async () => { await api("POST", `/api/items/${id}/reprocess`, {}); toast("queued for reprocessing"); }) }, "Reprocess"),
      h("button", { class: "btn danger", onclick: act(async () => { if (confirm("Delete this item?")) { await api("DELETE", "/api/items/" + id); toast("deleted"); show("search"); } }) }, "Delete")));
  put(main, c);
  if (it.evidence) put(main, h("div", { class: "card" }, h("b", {}, "Evidence"), h("div", { class: "q" }, it.evidence)));
  if (it.source) put(main, h("div", { class: "card" }, h("b", {}, "Source "), link(it.source.url, it.source.title || it.source.url),
    h("div", { class: "mut" }, [it.source.platform, it.source.content_type].filter(Boolean).join(" · ")),
    it.source.blob_sha256 ? h("div", {}, link(location.origin + "/api/blob/" + it.source.blob_sha256, "original file")) : null,
    ...it.citations.map((x) => h("div", { class: "q" }, h("span", { class: "mut" }, x.locator || ""), h("pre", {}, x.text))),
    ...it.inbox.map((x) => h("div", { class: "mut" }, "submitted " + x.added_at + " ", link(x.url)))));
  const tags = [...it.topics.map((t) => h("button", { class: "badge", onclick: () => show("search", { topic: t }) }, "#" + t)), ...it.entities.map((t) => badge(t, ""))];
  if (tags.length) put(main, h("div", { class: "card row" }, tags));
  if (it.related.length) put(main, h("div", { class: "card" }, h("b", {}, "Related"), ...it.related.map((r) =>
    h("div", {}, badge(r.type, ""), " ", h("a", { href: "#", onclick: (e) => { e.preventDefault(); detail(r.id); } }, r.title || r.id)))));
}

async function ask() {
  const q = h("input", { class: "grow", placeholder: "Ask a question about your library", "aria-label": "Question" });
  const out = h("div", {});
  const go = act(async () => {
    const a = await api("POST", "/api/ask", { q: q.value });
    clear(out); put(out, h("div", { class: "card" }, h("div", { class: "row" }, badge(a.mode, ""), badge("retrieval: " + a.retrieval_mode, ""), a.generated_by ? badge(a.generated_by, "") : null,
        a.egress.length ? badge("sent to: " + a.egress.join(", "), "failed") : null),
      a.interpretation ? h("pre", {}, a.interpretation) : h("p", { class: "mut" }, a.message),
      ...a.warnings.map((w) => h("p", { class: "warn" }, "⚠ " + w))),
      ...a.retrieved.map((e) => h("div", { class: "card" }, h("b", {}, `[${e.n}] `), e.title, " ", e.provenance ? badge(e.provenance) : null, " ",

  });

}
async function topics() {
  const t = await api("GET", "/api/topics");
  put(main, h("div", { class: "card row" }, t.map((x) => h("button", { class: "badge", onclick: () => show("search", { topic: x.name }) }, `#${x.name} (${x.n})`)),
    t.length ? null : h("span", { class: "mut" }, "No topics yet.")));
}
async function duplicates() {
  const d = await api("GET", "/api/duplicates");
  put(main, ...d.map((x) => h("div", { class: "card" }, badge(x.score.toFixed(2), ""), " ",
    h("a", { href: "#", onclick: (e) => { e.preventDefault(); detail(x.a.id); } }, x.a.title || x.a.id), " ≈ ",
    h("a", { href: "#", onclick: (e) => { e.preventDefault(); detail(x.b.id); } }, x.b.title || x.b.id))), d.length ? null : h("p", { class: "mut" }, "No duplicates found."));
}
async function digest() {
  const d = await api("GET", "/api/digest");
  const itemCard = (i) => h("div", { class: "card item", tabindex: "0", role: "button", onclick: () => detail(i.id), onkeydown: (e) => { if (e.key === "Enter") detail(i.id); } },
    badge(i.provenance), " ", i.title, " ", h("span", { class: "mut" }, i.created_at || ""));
  const topics = Object.entries(d.new.by_topic);
  put(main, h("p", { class: "mut" }, `${d.total} item(s) added since ${d.since} (preview: nothing is written)`),
    h("h3", {}, "New"), topics.length ? topics.map(([t, items]) => [h("b", {}, t), ...items.map(itemCard)]) : h("p", { class: "mut" }, "Nothing new."),
    h("h3", {}, "Needs attention"), d.attention.length ? d.attention.map((a) => h("div", { class: "card" }, badge(a.status, "failed"), " ", a.what || a.id, " ", h("span", { class: "mut" }, a.error || ""))) : h("p", { class: "mut" }, "Nothing is stuck."),
    h("h3", {}, "Worth revisiting"), d.resurfaced.length ? d.resurfaced.map(itemCard) : h("p", { class: "mut" }, "Nothing older to resurface yet."),
    h("h3", {}, "Possible duplicates"), d.duplicates.length ? d.duplicates.map((x) => h("div", { class: "card" }, `${x.a.title || x.a.id} / ${x.b.title || x.b.id}`)) : h("p", { class: "mut" }, "None found."));
}
async function status() {
  const [s, p] = await Promise.all([api("GET", "/api/state"), api("GET", "/api/privacy")]);
  put(main, h("div", { class: "card" }, h("b", {}, "Inbox"), h("div", { class: "row" }, Object.entries(s.counts).map(([k, v]) => badge(`${k}: ${v}`, k))), h("div", { class: "mut" }, s.items + " knowledge items")),
    h("div", { class: "card" }, h("b", {}, "Privacy"), h("p", {}, p.allow_remote ? "Remote backends are ALLOWED: text may leave this machine." : "Nothing leaves this machine (allow_remote is off)."),
      ...p.backends.map((b) => h("div", {}, badge(b.locality, b.locality === "remote" ? "failed" : "stated"), " ", b.name, " ", h("span", { class: "mut" }, b.type || ""))),
      ...p.skipped.map((k) => h("div", { class: "warn" }, `skipped ${k.name} (${k.task}): ${k.reason}`))),
    h("div", { class: "card" }, h("b", {}, "Egress"),
      ...Object.entries(p.egress.routes).filter(([, x]) => x.remote.length).map(([t, x]) =>
        h("div", {}, `${t}: ${x.remote.join(", ")} ${x.blocked ? "(blocked)" : "(active)"}; would send ${x.data}`)),
      ...p.egress.logged.map((e) => h("div", {}, `${e.backend}: ${e.calls} call(s), ${e.bytes_sent} bytes sent`)),
      h("p", { class: "mut" }, p.egress.note)));
}
// Settings: models, task routing, privacy. Edits a draft in memory; Save writes the config file and applies it live.
async function settings() {
  const c = await api("GET", "/api/config");
  const found = (await api("GET", "/api/providers/detect")).providers;
  const draft = {
    backends: Object.fromEntries(Object.entries(c.backends).map(([n, b]) => [n, b.spec])),
    editable: Object.fromEntries(Object.entries(c.backends).map(([n, b]) => [n, b.editable])),
    tasks: c.tasks, allow_remote: c.allow_remote,
  };
  const NUM = new Set(["context_window", "timeout", "max_tokens"]);
  const box = h("div", {});
  const field = (spec, key, label, list) => {
    const i = h("input", { class: "grow", value: spec[key] ?? "", "aria-label": label, list: list || null });
    i.addEventListener("input", () => {
      const v = i.value.trim();
      if (!v) delete spec[key]; else spec[key] = NUM.has(key) && !isNaN(Number(v)) ? Number(v) : v;
    });
    return h("label", { class: "row" }, h("span", { class: "lbl" }, label), i);
  };

    const s = h("select", { "aria-label": "Where it runs" }, [["", "auto (local if the URL is localhost)"], ["local", "local"], ["remote", "remote"]].map(([v, t]) => h("option", { value: v }, t)));
    s.value = spec.locality || "";
    s.addEventListener("change", () => { if (s.value) spec.locality = s.value; else delete spec.locality; });
    return h("label", { class: "row" }, h("span", { class: "lbl" }, "Where it runs"), s);
  };
  const backendCard = (name) => {
    const spec = draft.backends[name];
    const head = h("div", { class: "row" }, h("b", {}, name), badge(spec.type, ""), h("span", { class: "grow" }),
      h("button", { class: "btn sec", onclick: () => { delete draft.backends[name]; render(); } }, "Remove"));
    if (spec.subscription) return h("div", { class: "card" }, head, field(spec, "model", spec.subscription === "codex" ? "Model (required)" : "Model (optional)"),
      h("p", { class: "warn" }, "Remote: text is sent to " + spec.subscription + "'s vendor through your logged-in " + spec.subscription + " CLI (no API key). Blocked until you allow remote backends below."));
    if (!draft.editable[name]) return h("div", { class: "card" }, head, h("p", { class: "mut" }, "This type can only be changed in the config file."));
    const list = "models-" + name, dl = h("datalist", { id: list });
    const rows = [];
    if (spec.type === "openai_compat") {
      rows.push(field(spec, "base_url", "Server URL"), field(spec, "model", "Model", list), field(spec, "embed_model", "Embedding model (optional)", list),
        field(spec, "context_window", "Context size (tokens)"), where(spec), field(spec, "api_key_env", "API key env var (optional)"),
        h("div", { class: "row" }, h("button", { class: "btn sec", onclick: act(async () => {
          const r = await api("GET", "/api/models?base_url=" + encodeURIComponent(spec.base_url || ""));
          clear(dl); put(dl, r.models.map((m) => h("option", { value: m })));
          toast(r.models.length + " model(s) found; click the Model field to pick one");
        }) }, "Detect models"), dl));
    } else if (spec.type === "anthropic") {
      rows.push(field(spec, "model", "Model"), field(spec, "api_key_env", "API key env var"), field(spec, "max_tokens", "Max output tokens (optional)"),
        h("p", { class: "warn" }, "Remote: text is sent to the provider. Blocked until you allow remote backends below. The key is read from that environment variable of the shell that launched InfoParser; it is never stored here."));
    }
    return h("div", { class: "card" }, head, ...rows);
  };
  const uniq = (base) => { let n = base, i = 2; while (n in draft.backends) n = base + i++; return n; };
  const add = (key) => () => { const n = uniq(key); draft.backends[n] = { ...c.presets[key] }; draft.editable[n] = true; render(); };
  const addSub = (kind) => () => { const n = uniq(kind + "_sub"); draft.backends[n] = { type: "cli", subscription: kind }; draft.editable[n] = true; render(); };
  const subRow = (p) => {
    const ready = p.installed && p.logged_in;
    const state = !p.installed ? "not installed" : p.logged_in === false ? "not logged in: run `" + p.id + (p.id === "codex" ? " login" : " auth login") + "` in a terminal, then reload" : p.logged_in ? "logged in" : "login unknown";
    return h("div", { class: "row" }, h("b", {}, p.id), h("span", { class: "mut grow" }, state + (p.note ? " · " + p.note : "")),
      p.id in c.subscriptions ? h("button", { class: "btn sec", disabled: !ready, onclick: addSub(p.id) }, "+ Use my " + p.id + " subscription") : null);
  };
  const taskRow = (t) => {
    const i = h("input", { class: "grow", value: (draft.tasks[t] || []).join(", "), "aria-label": t });
    i.addEventListener("input", () => {
      const v = i.value.split(",").map((x) => x.trim()).filter(Boolean);
      if (v.length) draft.tasks[t] = v; else delete draft.tasks[t];
    });
    return h("label", { class: "row" }, h("span", { class: "lbl" }, t), i);
  };
  const remote = h("input", { type: "checkbox", checked: draft.allow_remote });
  remote.addEventListener("change", () => {
    if (remote.checked && !confirm("Allow text from your library to be sent to remote (hosted) backends?")) { remote.checked = false; return; }
    draft.allow_remote = remote.checked;
  });
  const save = act(async () => {
    for (const [n, s] of Object.entries(draft.backends)) if (draft.editable[n] && s.type !== "heuristic" && s.subscription !== "claude" && !s.model) throw new Error(n + ": choose a model first");
    await api("POST", "/api/config", { backends: draft.backends, tasks: draft.tasks, allow_remote: draft.allow_remote });
    toast("saved and applied"); show("settings");
  });
  function render() {
    clear(box);
    put(box, h("div", { class: "card" }, h("b", {}, "Models"),
        h("p", { class: "mut" }, "Without a model InfoParser still works (simple extractive mode). Add a model server, pick a model, save."),
        h("div", { class: "row" }, h("button", { class: "btn sec", onclick: add("local") }, "+ Local server (Ollama, LM Studio…)"),
          h("button", { class: "btn sec", onclick: add("cloud") }, "+ Anthropic (hosted)"))),
      h("div", { class: "card" }, h("b", {}, "Use my subscription (no API key)"),
        h("p", { class: "mut" }, "Runs your own logged-in CLI as a text model. Text only: embeddings, OCR and transcription still need a local model."),
        ...found.filter((p) => p.kind === "subscription").map(subRow)),
      ...Object.keys(draft.backends).map(backendCard),
      h("details", { class: "card" }, h("summary", {}, "Task routing (optional)"),
        h("p", { class: "mut" }, "Comma-separated backend names tried in order, e.g. local, cloud. Empty = every backend above, in order."),
        ...c.task_names.map(taskRow)),
      h("div", { class: "card" }, h("label", { class: "row" }, remote, h("span", {}, "Allow remote (hosted) backends to receive my text")),
        h("p", { class: "mut" }, "Off by default: nothing leaves this machine.")),
      h("div", { class: "row" }, h("button", { class: "btn", onclick: save }, "Save"),
        h("span", { class: "mut" }, "Applies immediately. Stored in " + c.path + " (hand-written comments are not preserved; a .bak copy is kept).")));
  }
  render();
  put(main, box);
}
addEventListener("keydown", (e) => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); show("search"); }
});
show("inbox");
</script>
</body>
</html>
