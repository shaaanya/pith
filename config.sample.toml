# Copy anywhere and pass it with `pith --config PATH ...` or PITH_CONFIG=PATH.
# Without --config/PITH_CONFIG, <home>/config.toml is used if it exists (the dashboard's Settings
# tab writes it; its `home` key is ignored there). Without any file the defaults apply (heuristic only).
# Env overrides: PITH_HOME, PITH_CONFIG, PITH_HTTP_TOKEN,
# PITH_YT_DLP, PITH_FFMPEG. See docs/configuration.md for every key.
home = "~/Pith"

[privacy]
allow_remote = false   # remote-tagged backends refuse to run until true

[limits]
max_attempts = 5
lease_seconds = 300
max_fetch_bytes = 50000000

[watch]
dirs = [
  "~/Pith/inbox",
  "~/Library/Mobile Documents/iCloud~is~workflow~my~workflows/Documents/Claude Inbox",
]

# Backends: model names live here only, never in code.
[backends.local]
type = "openai_compat"
locality = "local"
base_url = "http://localhost:11434/v1"
model = "REPLACE_WITH_LOCAL_MODEL"
# Ollama's /v1 serves a 4096-token context by default, while the built-in default assumes 8192, so long
# documents lose text silently. Set this to the context size your server really uses.
context_window = 4096
# embed_model = "REPLACE_WITH_EMBEDDING_MODEL"   # enables the embed task (hybrid search)
# api_key_env = "NAME_OF_ENV_VAR"                 # only if the server needs a key
# capabilities = ["json_mode"]                    # extras the server supports
# timeout = 120

[backends.heuristic]
type = "heuristic"

# Optional backends (placeholders only; model names live here, never in code).
# [backends.ocr]
# type = "tesseract"            # keys: binary = "tesseract", lang = "eng"
#
# [backends.stt]
# type = "whisper_cpp"          # UNVERIFIED against a real binary
# binary = "whisper-cli"
# model_path = "REPLACE_WITH_PATH_TO_GGML_MODEL"
# language = "en"               # optional
# threads = 4                   # optional
#
# [backends.cloud]
# type = "anthropic"            # remote: needs [privacy] allow_remote = true; live calls UNVERIFIED
# model = "REPLACE_WITH_MODEL"
# api_key_env = "ANTHROPIC_API_KEY"   # env var NAME, never the key itself
# max_tokens = 4096

# A command-line text generator (e.g. an agentic CLI used ONLY as a text backend; see
# docs/providers.md). The prompt arrives on stdin (or as the last argument with prompt_via = "arg").
# [backends.cli_text]
# type = "cli"
# command = ["REPLACE_WITH_COMMAND", "REPLACE_WITH_ARG"]
# prompt_via = "stdin"
# timeout = 300
# locality = "local"            # "remote" if the command sends text off this machine

# Use your SUBSCRIPTION instead of an API key: run the vendor's own, already logged-in CLI as a text
# backend (log in once in a terminal: `claude auth login` / `codex login` / `gemini`). These send your
# text to the vendor, so they are "remote" and need [privacy] allow_remote = true. Tools are disabled
# so the agent only answers. Do NOT add --bare to claude: it ignores the subscription login.
# [backends.claude_sub]          # verified live
# type = "cli"
# command = ["claude", "-p", "--tools", "", "--no-session-persistence"]
# locality = "remote"
# timeout = 300
#
# [backends.codex_sub]           # verified live; pick a model your plan supports (a cheap one is fine)
# type = "cli"
# command = ["codex", "exec", "-m", "REPLACE_WITH_CODEX_MODEL", "-c", "model_reasoning_effort=low",
#            "--sandbox", "read-only", "--ephemeral", "--skip-git-repo-check", "--color", "never"]
# locality = "remote"
# timeout = 300
#
# [backends.gemini_sub]          # NOT WORKING for personal Google accounts (gemini 0.67.0 answers
#                                # "IneligibleTierError ... migrate to Antigravity"). May work with a
#                                # Workspace/Code Assist licence or a newer CLI: UNVERIFIED. Headless
#                                # runs also need GEMINI_CLI_TRUST_WORKSPACE=true in the environment.
# type = "cli"
# command = ["gemini", "-p", "", "--approval-mode", "plan"]
# locality = "remote"
# timeout = 300

# Task routing: ordered fallback lists, "name" or "name:model".
[tasks]
distill = ["local", "heuristic"]
classify = ["local", "heuristic"]
# ocr = ["ocr"]
# transcribe = ["stt"]
# embed = ["local"]             # needs embed_model on that backend
# answer = ["local"]            # `ask`; without one, ask returns cited excerpts only

# HTTP ingest (`pith serve-http`). Loopback by default; the token is generated into
# <home>/http_token. A non-loopback bind requires an explicit token and is NOT recommended.
# [http]
# bind = "127.0.0.1"
# port = 8787
# token = "REPLACE_WITH_LONG_RANDOM_TOKEN"
# [media]
# yt_dlp = "yt-dlp"
# ffmpeg = "ffmpeg"
# Instagram/TikTok links need a login: use a THROWAWAY account in a dedicated browser profile
# (docs/configuration.md). Off by default.
# cookies_from_browser = "firefox:pith"
# cookie_domains = ["instagram.com", "tiktok.com"]
# cookie_gap_seconds = 20

# [digest]
# interval_days = 7     # at most one digest per interval
# max_items = 20        # cap on items listed per section
