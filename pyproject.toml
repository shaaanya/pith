[project]
name = "pith"
version = "0.1.0"
description = "Local-first, model-agnostic personal knowledge system"
requires-python = ">=3.13"
dependencies = ["numpy"]

[project.scripts]
pith = "pith.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pith.store" = ["migrations/*.sql"]
"pith.dashboard" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_ollama: needs a running local Ollama (skipped by default)",
  "slow: slow tests",
]

[tool.pylint.main]
source-roots = ["src", "tests"]
# init-hook assumes the repo root as the working directory
init-hook = "import sys; sys.path.insert(0, 'src')"
